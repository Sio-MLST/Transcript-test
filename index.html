<script>
const TURNS = [{"t":0,"s":0,"x":"Imagine a massive, intricate machine. Every time you drop a number into the top, it spits out a chaotic, wildly unpredictable path."},{"t":7,"s":1,"x":"Right."},{"t":8,"s":0,"x":"It bounces around seemingly at random, defying literally every attempt to track its logic. But if you take that exact same machine, flip it upside down, and run it in reverse,"},{"t":19,"s":1,"x":"it suddenly behaves with absolute, terrifying perfection."},{"t":23,"s":0,"x":"Yes, exactly. It mathematically maps out the entire universe of numbers without a single structural flaw."},{"t":29,"s":1,"x":"It is a profound paradox. Honestly, we are looking at a space where intuition based on sheer volume completely shatters against formal structural limits."},{"t":40,"s":0,"x":"And that brutal collision is the objective of our deep dive today. We are looking directly at the late 2026 landscape of the $3x + 1$ dynamical system."},{"t":49,"s":1,"x":"The Collatz conjecture."},{"t":51,"s":0,"x":"Right. But our mission here is to audit where we actually stand today. We will navigate the critical distinctions between established archival theorems, unrefereed preprints, and machine-verified formalizations,"},{"t":62,"s":1,"x":"cutting through the immense noise of recent claims to isolate the exact mathematical reality."},{"t":68,"s":0,"x":"Exactly. We aren't here to rehash the history or the elementary rules of the map. You already know the territory. We are going straight into the structural limits of what has actually been proven."},{"t":78,"s":1,"x":"To do that, um, we have to ground ourselves in the defining tension of the problem. We need to look at what the mathematical community calls the sublinear trap."},{"t":87,"s":0,"x":"The sublinear trap."},{"t":88,"s":1,"x":"Yeah. Let's start with the inverse tree: the set of positive integers that we mathematically know for a certainty eventually reach the trivial cycle of $\\{1, 4, 2\\}$."},{"t":99,"s":0,"x":"Okay."},{"t":101,"s":1,"x":"Let's assign a counting function to this, which we call $\\pi(x)$. This function's only job is to count how many of those proven integers exist up to a specific arbitrary cutoff value on the number line, which we'll just call $x$."},{"t":114,"s":0,"x":"So we are just tallying up the successful numbers as we move outward toward infinity."},{"t":119,"s":1,"x":"Precisely. Now imagine a hypothetical scenario where we prove that this counting function $\\pi(x)$ grows at a polynomial rate of $x^{0.9999}$."},{"t":131,"s":0,"x":"Oh, wow."},{"t":132,"s":1,"x":"Right. In practical computational terms, that implies that as you look at larger and larger expanses of the number line, the sheer quantity of numbers you have proven to reach $1$ is astronomical."},{"t":143,"s":0,"x":"It looks, for all intents and purposes, like you have captured almost everything."},{"t":148,"s":1,"x":"Exactly."},{"t":149,"s":0,"x":"Okay, let's unpack this, because an exponent of $0.9999$ feels like a victory."},{"t":154,"s":1,"x":"It does. "},{"t":155,"s":0,"x":"It's so incredibly close to $1$. But when we transition from just counting the raw growth to calculating the lower natural density, the entire picture flips on its head."},{"t":165,"s":1,"x":"It really does. The lower natural density of a set of integers is mathematically defined as the limit inferior as $x$ approaches infinity of that counting function $\\pi(x)$ divided by $x$ itself."},{"t":177,"s":0,"x":"Hold on, let me translate limit inferior for a second for everyone. We are essentially taking our massive set of proven numbers and dividing it by the total sequence of all positive integers up to that point, right?"},{"t":189,"s":1,"x":"Right."},{"t":189,"s":0,"x":"We're asking for the true rock-bottom, guaranteed mathematical proportion over the long haul."},{"t":195,"s":1,"x":"And if your growth bound is strictly sublinear, meaning the exponent is any number strictly less than $1$—even $0.9999$—then your implied lower density bound evaluates to exactly zero."},{"t":206,"s":0,"x":"Zero."},{"t":207,"s":1,"x":"Absolute zero. The limit as $x$ approaches infinity of $x^{0.9999} / x$ is the same as the limit of $1 / x^{0.0001}$."},{"t":219,"s":0,"x":"Right."},{"t":220,"s":1,"x":"And as $x$ goes to infinity, the denominator grows without bound, meaning that fraction goes to zero."},{"t":226,"s":0,"x":"It's like filling a bucket with a hose, but the bucket's walls are expanding faster than the water flows in."},{"t":232,"s":1,"x":"That's a great way to put it."},{"t":233,"s":0,"x":"No matter how many gallons you have, the bucket is functionally empty. Even with that massive exponent, the set of numbers you've proved steadily thins out relative to the sheer size of the number line. "},{"t":244,"s":1,"x":"It remains mathematically compatible with a natural density of zero."},{"t":248,"s":0,"x":"That is the sublinear trap in a nutshell. And because bottom-up counting arguments so easily fall victim to this dilution, the earliest systematic line of attack in the literature sought to bypass the concept of density entirely."},{"t":261,"s":1,"x":"The strategy was to move top-down."},{"t":263,"s":0,"x":"Right. If you can prove that non-trivial periodic orbits—meaning any cycles other than the trivial $1 \\to 4 \\to 2$ loop—cannot possibly exist, you fundamentally alter the landscape."},{"t":276,"s":1,"x":"Because if you can definitively eliminate the existence of any other loops, you strip the dynamical system of its alternative attractors."},{"t":283,"s":0,"x":"But I'm looking at the notes here, and doing that requires locking the dynamics into a really rigid algebraic cage."},{"t":291,"s":1,"x":"Yeah, it does. To set that trap, researchers focus on the accelerated Syracuse map."},{"t":295,"s":0,"x":"The accelerated map."},{"t":297,"s":1,"x":"Yes, which acts strictly on the odd positive integers. The map $T(n)$ multiplies an odd number by $3$, adds $1$, and then divides out every single factor of $2$ in one massive accelerated step until you land on the very next odd integer."},{"t":313,"s":0,"x":"So we are leaping directly from odd number to odd number, totally compressing all the intermediate even steps into a single operation."},{"t":321,"s":1,"x":"Precisely. Now suppose a hypothetical non-trivial cycle actually exists out there. It would consist of $k$ odd steps, and across that entire cycle, there would be a total of capital $K$ divisions by $2$."},{"t":335,"s":0,"x":"Okay, got it."},{"t":336,"s":1,"x":"If you track the algebra of that loop, it forces an exact, inescapable identity on the starting element of the cycle, which we will call $n_0$."},{"t":347,"s":0,"x":"I'm looking at this exact algebraic identity in the source material, and it looks like a dense wall of algebra."},{"t":353,"s":1,"x":"It's intimidating."},{"t":354,"s":0,"x":"It says $n_0$ multiplied by the quantity $(2^K - 3^k)$, and that is supposed to exactly equal a very specific summation on the right side."},{"t":370,"s":1,"x":"Right."},{"t":371,"s":0,"x":"What is this equation actually forcing the numbers to do?"},{"t":374,"s":1,"x":"Think of it as a structural mandate. The right side of that equation is a summation built entirely out of positive integers—specifically, powers of $3$ and powers of $2$ added together based on the cumulative count of divisions at each step."},{"t":388,"s":0,"x":"Okay."},{"t":389,"s":1,"x":"Because you are adding positive integers, the entire right side of the equation is strictly positive."},{"t":395,"s":0,"x":"I see where this is going. If the right side is strictly positive, the left side has to be strictly positive to maintain the equality."},{"t":401,"s":1,"x":"Exactly."},{"t":402,"s":0,"x":"And since our starting element $n_0$ is a positive integer, the coefficient it is multiplied by must also be positive. "},{"t":410,"s":1,"x":"Therefore, $2^K - 3^k$ must be greater than zero."},{"t":417,"s":0,"x":"Which means $2^K$ must be strictly greater than $3^k$."},{"t":423,"s":1,"x":"Which locks any hypothetical cycle into what the literature calls the supercritical regime."},{"t":428,"s":0,"x":"The supercritical regime."},{"t":431,"s":1,"x":"Yeah. If you take the base-2 logarithm of both sides of that inequality, you find that the ratio of total divisions to odd steps—that is, capital $K$ divided by lowercase $k$—must strictly exceed the base-2 logarithm of $3$."},{"t":445,"s":0,"x":"And the base-2 log of $3$ is roughly $1.58496$."},{"t":450,"s":1,"x":"Yes."},{"t":451,"s":0,"x":"So you are saying any non-trivial cycle in this entire dynamical system is instantly forced to obey this strict division-to-step ratio."},{"t":460,"s":1,"x":"It has to."},{"t":461,"s":0,"x":"It can't just be any loop; it has to have a very specific density of even to odd steps."},{"t":466,"s":1,"x":"And from that exact algebraic identity, the mathematical community developed a highly sophisticated three-part analytical framework to hunt down and exclude these hypothetical cycles."},{"t":475,"s":0,"x":"Okay. What's the first part?"},{"t":476,"s":1,"x":"The first prong is Diophantine analysis,"},{"t":479,"s":0,"x":"which treats that algebraic identity as a discrete exact lock. But how do they actually pick the lock?"},{"t":486,"s":1,"x":"By fixing a specific combinatorial sequence of division exponents, you basically tell the system, \"let's test this exact specific pattern of odd and even parities.\""},{"t":497,"s":0,"x":"Okay."},{"t":498,"s":1,"x":"Once you fix that sequence, all the coefficients in your summation are totally determined. The problem then reduces to a pure Diophantine question: does this specific summation evaluate to an exact integer multiple of that coefficient on the left?"},{"t":514,"s":0,"x":"But the sources are very clear about the immediate brick wall this approach hits. It's the combinatorial explosion of parity sequences."},{"t":521,"s":1,"x":"Yeah, the complexity blows out."},{"t":523,"s":0,"x":"It's like trying to crack a padlock, but every time you add a single step to your hypothetical cycle, the padlock adds an exponentially larger number of new dials."},{"t":532,"s":1,"x":"It's a perfect analogy."},{"t":533,"s":0,"x":"You cannot brute-force test every single discrete lock because the universe of possible parity arrangements grows too fast,"},{"t":540,"s":1,"x":"which forces the methodology to shift domains. Unable to win in the discrete integer realm, the second prong of the framework shifts the battleground into continuous real space."},{"t":550,"s":0,"x":"Continuous real space."},{"t":551,"s":1,"x":"Yeah. This is the Archimedean bounds approach."},{"t":554,"s":0,"x":"By taking logarithms, you convert that rigid exact cycle identity into an approximate equality concerning real magnitudes."},{"t":561,"s":1,"x":"Exactly."},{"t":562,"s":0,"x":"And this introduces a concept the literature denotes as $\\Lambda$, the residual gap."},{"t":567,"s":1,"x":"$\\Lambda$ is defined as capital $K \\ln 2 - k \\ln 3$."},{"t":574,"s":0,"x":"Okay."},{"t":575,"s":1,"x":"Think of it as a measure of the discrepancy between the powers of $2$ and $3$ in our supercritical regime. Because we already established that $2^K > 3^k$, we know that $\\Lambda$ must be strictly positive."},{"t":589,"s":0,"x":"Okay, let's look at the mechanics of this. How does this gap, this $\\Lambda$, actually help us kill off cycles?"},{"t":595,"s":1,"x":"Because the summation on the right side of our cycle identity is mathematically bounded by a geometric series, we can use $\\Lambda$ to constrain the absolute minimal element of any hypothetical cycle, which we call $n_{\\min}$."},{"t":607,"s":0,"x":"Right."},{"t":609,"s":1,"x":"The elementary Archimedean inequality states that $n_{\\min}$ must be strictly less than the number of odd steps $k / 3^\\Lambda$."},{"t":618,"s":0,"x":"Well, let me visualize that fraction. If your residual gap $\\Lambda$ is a relatively large number, then your denominator $3^\\Lambda$ becomes absolutely massive."},{"t":628,"s":1,"x":"Yes."},{"t":629,"s":0,"x":"And if you are dividing by a massive number, your ceiling for the minimal element is forced to be very small."},{"t":635,"s":1,"x":"And we already know, thanks to massive computational brute-force searches, that there are absolutely no non-trivial cycles below approximately $2^{68}$."},{"t":644,"s":0,"x":"Oh, wow. So if a cycle has a large residual gap, the mathematics forces its smallest element to be tiny, well below that $2^{68}$ threshold."},{"t":654,"s":1,"x":"Exactly."},{"t":655,"s":0,"x":"But we've checked everything below that threshold, and it's empty. Therefore, any cycle with a substantial residual gap is definitively mathematically ruled out. It just can't exist."},{"t":665,"s":1,"x":"The only way a cycle could theoretically survive and hide in the unsearched wilderness above $2^{68}$ is if that residual gap $\\Lambda$ were infinitesimally small."},{"t":675,"s":0,"x":"Meaning the powers of $2$ and the powers of $3$ would have to approximate each other with an almost unnatural, microscopic precision just to squeeze into that tiny mathematical blind spot."},{"t":686,"s":1,"x":"Which brings us to the third prong of the analytical framework to close that blind spot: Baker-type bounds, specifically the theory of linear forms in logarithms."},{"t":695,"s":0,"x":"I know Alan Baker won a Fields Medal for this kind of work. What does his theory actually do to our gap?"},{"t":701,"s":1,"x":"Baker essentially proved that non-zero linear combinations of logarithms of algebraic numbers—which is exactly what our $\\Lambda$ is, $K \\ln 2 - k \\ln 3$—cannot just slide arbitrarily close to zero without facing a consequence."},{"t":715,"s":0,"x":"A consequence."},{"t":717,"s":1,"x":"Yes, there is a fundamental, quantifiable mathematical repulsion. Explicit estimates developed later by Laurent, Mignotte, and Nesterenko provide a concrete floor for this repulsion."},{"t":728,"s":0,"x":"Okay."},{"t":729,"s":1,"x":"They established that the natural log of $\\Lambda$ must be greater than or equal to a negative constant $C$ multiplied by the square of the natural log of capital $K$."},{"t":739,"s":0,"x":"Okay, so let me put this three-part machine together. The Archimedean inequality puts a ceiling on how large the cycle's minimal element can be based on the gap $\\Lambda$."},{"t":748,"s":1,"x":"Right."},{"t":749,"s":0,"x":"But the Baker-type bounds put a hard floor on how small that gap can actually get."},{"t":754,"s":1,"x":"By substituting the Baker floor back into the Archimedean ceiling, you generate a highly effective, explicit upper bound on the smallest element of any hypothetical cycle of a given length."},{"t":765,"s":0,"x":"And researchers have been turning the crank on this machine for decades. I mean, R. P. Steiner used it alongside lattice-basis reduction to prove the only 1-cycle is the trivial cycle."},{"t":774,"s":1,"x":"Yes."},{"t":775,"s":0,"x":"Simons and de Weger used it to eliminate cycles with up to $68$ local minima. And looking at the late 2026 landscape, we see that Hercher extended this exclusion to cycles with up to $91$ local minima."},{"t":788,"s":1,"x":"But this is a vital distinction we must make: cycle exclusion is not global resolution."},{"t":793,"s":0,"x":"It's not."},{"t":794,"s":1,"x":"Hercher's results, while computationally and analytically massive, still heavily rely on the limits of brute-force verification."},{"t":801,"s":0,"x":"Wait, if this three-part machine works so well, why can't we just run it to infinity and kill all the cycles?"},{"t":808,"s":1,"x":"Because the entire methodology hits a structural brick wall when we consider cycles where the combinatorial complexity—the number of local minima, which we denote as $m$—grows linearly with the overall cycle length."},{"t":820,"s":0,"x":"So as the structure of the hypothetical cycle gets more complex, the multidimensional Baker bounds start to break down."},{"t":827,"s":1,"x":"They do. The repulsion estimates lose their sharpness, the floor provided by Baker drops, the ceiling provided by Archimedes rises, and the gap between them widens to a point where they no longer force a mathematical contradiction against our computationally verified range of $2^{68}$."},{"t":843,"s":0,"x":"It's like having a vice grip that works perfectly on small objects, but if you try to clamp it around something incredibly wide, the threads strip."},{"t":851,"s":1,"x":"That's a great way to put it."},{"t":852,"s":0,"x":"The established Diophantine and Baker-type method simply cannot establish that cycles of arbitrary complexity are impossible. The top-down strategy successfully clears out a massive amount of underbrush, but the canopy—periodic orbits of unrestricted combinatorial complexity—remains theoretically wide open."},{"t":870,"s":1,"x":"Which perfectly explains the historical pivot in the literature. Unable to definitively eliminate cycles of arbitrary complexity from the top down, the field simultaneously developed a bottom-up strategy."},{"t":882,"s":0,"x":"Okay, the bottom-up strategy."},{"t":884,"s":1,"x":"Yeah. If we can't prove that alternative cycles don't exist, let's try to prove that the vast majority of numbers flow into the trivial cycle we do know about. And this takes us right back to the inverse branching tree descending from $1$. We are looking for lower bounds on that counting function $\\pi(x)$. This program advanced incrementally over decades. Crandall first established a polynomial growth bound."},{"t":905,"s":0,"x":"Right."},{"t":906,"s":1,"x":"Krasikov introduced difference inequalities yielding an exponent of $0.43$. Wirsching pushed that to $0.48$."},{"t":914,"s":0,"x":"Wow."},{"t":915,"s":1,"x":"Applegate and Lagarias utilized computer-assisted tree search to reach $0.65$, and later applied nonlinear programming to Krasikov's inequalities to hit $0.81$."},{"t":925,"s":0,"x":"Which brings us to the archival gold standard: the 2003 theorem of Krasikov and Lagarias."},{"t":930,"s":1,"x":"Yes, this is the peer-reviewed benchmark against which all modern claims must be measured. Their theorem establishes that for all sufficiently large $x$, the counting function $\\pi(x)$ is greater than or equal to $x^{0.84}$."},{"t":948,"s":0,"x":"And the mechanism they used to achieve this $0.84$ bound is mathematically fascinating. They had to balance the generating functions of the inverse map."},{"t":958,"s":1,"x":"Balance them."},{"t":960,"s":0,"x":"Yes, because when you run the Collatz map in reverse, you are dealing with two highly antagonistic operations."},{"t":967,"s":1,"x":"Let's visualize that tug-of-war. What are the two forces?"},{"t":970,"s":0,"x":"On one hand, you have the inverse even step mapping $n$ to $2n$. This is explosive. It creates a single, rapidly growing, unbranching lineage."},{"t":980,"s":1,"x":"It's a superhighway. You just keep doubling and doubling and shooting off into massive numbers very quickly."},{"t":984,"s":0,"x":"Fighting against that explosive growth, you have the inverse odd step mapping $n$ to $(n - 1) / 3$."},{"t":992,"s":1,"x":"Okay."},{"t":994,"s":0,"x":"This step is contracting, and it is what actually creates the branching structure of the tree, giving it width. The $0.84$ exponent was derived by masterfully balancing these explosive and contracting forces within a highly complex system of difference inequalities."},{"t":1010,"s":1,"x":"But as we audit the late 2026 landscape, we have to look at the recent unrefereed preprints attempting to push past this $0.84$ benchmark."},{"t":1018,"s":0,"x":"Right."},{"t":1018,"s":1,"x":"And these recent attempts perfectly illustrate just how mathematically fragile these inverse tree models actually are."},{"t":1025,"s":0,"x":"A perfect example is the December 2025 preprint by Chao Liu titled *Counting the Collatz numbers*."},{"t":1031,"s":1,"x":"Yes, I saw this one."},{"t":1033,"s":0,"x":"In the initial version of that preprint, Liu announced a massive leap: an exponent of $0.946$."},{"t":1040,"s":1,"x":"Which would have been incredible, but we have to explicitly caution you, the listener, regarding these unrefereed claims. What happened when the mathematical community actually looked under the hood of Liu's work?"},{"t":1053,"s":0,"x":"Critical topological dependency errors were revealed."},{"t":1056,"s":1,"x":"What exactly does a topological dependency error look like in an inverse tree?"},{"t":1061,"s":0,"x":"In this specific context, it involves overcounting branches. The error stemmed from incorrectly treating certain branches as independent when in reality they relied on consecutive odd inverse operations. And the fundamental arithmetic structure of the map heavily constrains that. When you run the map in reverse, applying an odd inverse step produces a number that is congruent to zero modulo $3$. So it produces a multiple of three."},{"t":1086,"s":1,"x":"Yes, but a number that is a multiple of three cannot possibly have an odd predecessor."},{"t":1092,"s":0,"x":"Wait, really? It's like mapping a city's roads but forgetting some are one-way streets or dead ends, so your algorithm starts counting theoretical routes that cars can't actually drive."},{"t":1102,"s":1,"x":"Exactly."},{"t":1103,"s":0,"x":"If your tree model doesn't mathematically account for that zero modulo 3 dead end, you start counting phantom branches that simply do not exist in the arithmetic reality. And to his credit, once this was pointed out, Liu issued a second version of the preprint, retracting the $0.946$ figure."},{"t":1119,"s":1,"x":"Oh, he retracted it."},{"t":1120,"s":0,"x":"Yes. The revised exponent in version two is $0.3227$."},{"t":1125,"s":1,"x":"Wow. Let that sink in. It falls from a purported breakthrough of $0.946$ all the way down to $0.3227$, which is drastically below the 2003 baseline of $0.84$."},{"t":1138,"s":0,"x":"It is a stark reminder of why review and community scrutiny are absolutely non-negotiable in this field."},{"t":1145,"s":1,"x":"Right. We also have L. Mazur's July 2026 manuscript to consider in this category. This preprint claims a Lean-formalized bound of $\\pi(x)$ growing on the order of $x^{0.90}$, specifically for predecessor sets of targets not divisible by $3$."},{"t":1162,"s":0,"x":"Well, let's play devil's advocate for a second. Let's assume that Mazur's machine-checked proof is entirely structurally sound and eventually passes peer review."},{"t":1170,"s":1,"x":"Okay, let's assume that."},{"t":1171,"s":0,"x":"We are looking at $x^{0.90}$. We have to point out the fundamental mathematical reality here, connecting right back to our baseline at the beginning of the show: we are right back in the sublinear trap."},{"t":1183,"s":1,"x":"Exactly. An exponent of, say, $0.90$ is still strictly sublinear. It is less than $1$. So even if perfectly verified, this bound leaves the lower natural density of the basin of attraction at absolutely zero."},{"t":1199,"s":0,"x":"Yes, we are back in the bucket dilution scenario. Counting growth, no matter how computationally impressive the exponent is, is categorically, mathematically distinct from positive natural density."},{"t":1209,"s":1,"x":"Which means the bottom-up strategy—the inverse tree—while structurally illuminating and yielding these complex difference inequalities, currently leaves us trapped behind that sublinear barrier."},{"t":1220,"s":0,"x":"So if the backward tree traps us in zero density, the natural analytical pivot is to ask what happens when we reverse our perspective."},{"t":1227,"s":1,"x":"Right."},{"t":1228,"s":0,"x":"What happens when we track individual orbits forward in time?"},{"t":1231,"s":1,"x":"If we can't build a tree from the bottom up to capture a positive density, let's just drop points from the top down and prove they all fall."},{"t":1239,"s":0,"x":"This is the transition into forward dynamics."},{"t":1241,"s":1,"x":"The archival foundations of forward descent begin with R. Terras in 1976. Terras proved that the set of positive integers possessing a finite stopping time has a natural density of $1$."},{"t":1252,"s":0,"x":"Let's clarify that term. A finite stopping time just means the orbit eventually hits a value strictly smaller than its starting point."},{"t":1259,"s":1,"x":"Correct."},{"t":1260,"s":0,"x":"It guarantees a single local descent, not that it plummets all the way to $1$."},{"t":1264,"s":1,"x":"Then in 1994, I. Korec strengthened this result. Also measuring in natural density, Korec proved that for almost every integer $n$, the orbit will eventually drop below $n^\\theta$, for any $\\theta$ strictly greater than $\\log 3 / \\log 4$,"},{"t":1280,"s":0,"x":"which is roughly $0.7924$."},{"t":1283,"s":1,"x":"Yes."},{"t":1284,"s":0,"x":"So almost every number drops below its own $0.7924$ power. But we need to be very rigorous here for you, the listener: localized descent, even deep descent below a fractional power, does not equal global convergence."},{"t":1297,"s":1,"x":"Absolutely not."},{"t":1298,"s":0,"x":"Proving that an orbit drops below $n^{0.7924}$ does absolutely nothing to prevent that exact same orbit from bouncing off that temporary floor, subsequently diverging to infinity, or getting permanently trapped in some astronomically large cycle we haven't found yet."},{"t":1312,"s":1,"x":"Descent is not convergence."},{"t":1314,"s":0,"x":"But the forward dynamics program did see a major, highly celebrated breakthrough in 2022. Terence Tao published a theorem in *Forum of Mathematics, Pi*."},{"t":1323,"s":1,"x":"He established that almost all Collatz orbits attain almost bounded values."},{"t":1328,"s":0,"x":"I remember when this paper dropped. It is a monumental piece of mathematics. Tao essentially proved that you can pick a threshold function $f(n)$ that diverges to infinity, and you can make it grow incredibly slowly."},{"t":1340,"s":1,"x":"Right, extremely slowly."},{"t":1342,"s":0,"x":"You could pick the natural log of the natural log of the natural log of $n$—an almost microscopic upward slope—and Tao proved that almost all orbits will eventually drop below that slow-growing threshold."},{"t":1354,"s":1,"x":"However, here is where we must draw a massive, heavily highlighted distinction regarding Tao's theorem. It is a distinction of mathematical measure."},{"t":1363,"s":0,"x":"Okay, what's the distinction?"},{"t":1365,"s":1,"x":"Tao's theorem is established strictly with respect to logarithmic density, denoted in the literature as $d_{\\log}$. It is not a result in natural density."},{"t":1375,"s":0,"x":"We need to make sure you, the listener, grasp just how wide the chasm is between logarithmic density and natural density, because this is where the math gets heavily misinterpreted."},{"t":1384,"s":1,"x":"Very often, yes."},{"t":1386,"s":0,"x":"Think of it like this: if natural density is a purely democratic vote where every single integer gets exactly one equal ballot, logarithmic density is an electoral system where the voting power of larger numbers is aggressively suppressed."},{"t":1399,"s":1,"x":"That analogy perfectly captures the mechanics. In natural density, every integer up to your cutoff $x$ carries a uniform statistical weight of $1$. You just count them, right?"},{"t":1409,"s":0,"x":"Right."},{"t":1410,"s":1,"x":"But in logarithmic density, each integer $n$ is weighted by the fraction $1/n$."},{"t":1416,"s":0,"x":"So the number $10$ gets a voting weight of $1/10$."},{"t":1419,"s":1,"x":"Exactly."},{"t":1420,"s":0,"x":"But the number $1\\text{ million}$ only gets a voting weight of $1/1{,}000{,}000$."},{"t":1423,"s":1,"x":"Exactly."},{"t":1424,"s":0,"x":"The further out you go on the number line, the less the numbers matter to the overall density calculation."},{"t":1429,"s":1,"x":"The formal mathematical definition of the logarithmic density of a set $S$ is the limit as $x$ goes to infinity of the sum of $1/n$ for all $n \\in S$ up to $x$, divided by the harmonic sum up to $x$. And this $1/n$ weighting acts as a massive statistical dampener on the entire system."},{"t":1444,"s":0,"x":"Precisely. Why do you need a dampener?"},{"t":1447,"s":1,"x":"Because it effectively hides chaotic outliers. If there are rare, wildly misbehaving orbits that only appear at incredibly high integers, the $1/n$ weighting crushes their statistical significance, allowing the limit of the calculation to actually stabilize."},{"t":1462,"s":0,"x":"Oh, I see."},{"t":1464,"s":1,"x":"Tao's analytical machinery relies on this: he uses a first-passage random variable associated with the Syracuse dynamics, and that variable only stabilizes under the heavy suppression of the $1/n$ dampener."},{"t":1475,"s":0,"x":"Now just to be thorough, it is true that if a set possesses a well-defined natural density, its logarithmic density will exist and will perfectly equal that natural density."},{"t":1484,"s":1,"x":"That is true."},{"t":1485,"s":0,"x":"But the reverse is absolutely not true."},{"t":1487,"s":1,"x":"It is entirely possible for a set of integers to have a logarithmic density of exactly $1$ while its natural density oscillates wildly indefinitely, never settling on a limit."},{"t":1498,"s":0,"x":"So while Tao's result is a profound achievement in controlling the dynamics under a logarithmic measure, he does not prove natural density descent, nor does he prove eventual convergence to $1$."},{"t":1509,"s":1,"x":"The chasm between logarithmic density and natural density remains uncrossed in the peer-reviewed literature."},{"t":1516,"s":0,"x":"Which leads us directly into the 2026 preprint wave, because crossing this chasm is exactly what recent unrefereed attempts have tried to do."},{"t":1524,"s":1,"x":"We see this explicitly in the manuscripts. L. Mazur has a preprint claiming natural-density-one descent below every diverging threshold within logarithmic time, again accompanied by a Lean formalization."},{"t":1537,"s":0,"x":"Okay."},{"t":1539,"s":1,"x":"Parallel to that, we have I. A. Shaik claiming polylogarithmic descent in natural density with a logarithmic leading time."},{"t":1546,"s":0,"x":"Both of these are highly ambitious attempts to translate the spirit of Tao's almost bounded result out of the suppressed logarithmic measure and into the uniform, unweighted natural density measure."},{"t":1557,"s":1,"x":"Right."},{"t":1558,"s":0,"x":"But again, these are unrefereed claims. And as we move from mere descent to the ultimate prize, the claims get even bolder. The deep dive sources highlight that 2026 also saw preprints claiming actual positive lower natural density for the basin of attraction itself."},{"t":1573,"s":1,"x":"Yes,"},{"t":1574,"s":0,"x":"not just dropping below a log-log threshold, but claims that a strictly positive percentage of all integers unequivocally reach $1$."},{"t":1583,"s":1,"x":"Let's unpack these preprints carefully to see exactly what is being claimed under the hood."},{"t":1587,"s":0,"x":"Let's do it."},{"t":1588,"s":1,"x":"Mazur's work on Proof Atlas claims the existence of an explicit positive constant $c$ and a cutoff $X_0$ such that at least $c X$ integers below every sufficiently large $X$ reach $1$ within $10.46 \\ln n$ ordinary steps—"},{"t":1605,"s":0,"x":"a direct claim of a positive natural density, a linear proportion."},{"t":1609,"s":1,"x":"Yes. And Mazur extended this in a companion preprint to predecessor sets of any target not divisible by $3$."},{"t":1616,"s":0,"x":"Okay, wow."},{"t":1617,"s":1,"x":"Building directly upon Mazur's construction, we have a preprint hosted on the Hexagon network by Kelvin Lau. And we should explicitly note for clarity that Kelvin Lau is a completely different author than Chao Liu, whom we discussed earlier regarding the topological tree errors."},{"t":1632,"s":0,"x":"Different mathematician, different approach entirely."},{"t":1635,"s":1,"x":"Yeah."},{"t":1636,"s":0,"x":"So what is Lau doing?"},{"t":1637,"s":1,"x":"Lau utilizes an automated AI prover to derive an explicit refinement of Mazur's constant. The claim is that for every capital $N$, the number of odd integers below $N$ reach $1$ within $10.46 \\ln n$ steps is at least the floor of $N$ divided by a specific explicit denominator."},{"t":1659,"s":0,"x":"I need to read this denominator out loud from the sources because it is a critical observation regarding the real-world mathematical implications of this claim."},{"t":1666,"s":1,"x":"Go for it."},{"t":1667,"s":0,"x":"The bound claims the number of integers is at least: $$\\left\\lfloor \\frac{N}{2^{2^{2^{163}}}} \\right\\rfloor.$$"},{"t":1675,"s":1,"x":"A triply iterated power of $2$."},{"t":1678,"s":0,"x":"Let's just look at the sheer absurdity of that denominator. $2^{163}$ is already a staggeringly large number. Then you raise $2$ to that power. Then you raise $2$ to that unimaginable power. The denominator is incomprehensibly massive."},{"t":1694,"s":1,"x":"And because the formula takes the floor of the fraction, we have to consider what happens for any value of $N$ that is strictly smaller than that denominator."},{"t":1702,"s":0,"x":"Okay."},{"t":1703,"s":1,"x":"If $N$ is less than $2^{2^{2^{163}}}$, the entire fraction evaluates to less than $1$. And the floor function crushes any decimal less than $1$ down to exactly zero."},{"t":1715,"s":0,"x":"Exactly. If $N$ is any number that can physically be written down, computed, or even conceptualized in our physical universe, the formula guarantees precisely zero numbers reach $1$."},{"t":1725,"s":1,"x":"It evaluates to zero."},{"t":1726,"s":0,"x":"It only begins to claim a positive quantity of numbers once $N$ surpasses that triply iterated power. It is a purely asymptotic bound."},{"t":1735,"s":1,"x":"It guarantees a positive density at infinity, but it provides zero structural information for the observable number line."},{"t":1743,"s":0,"x":"Right."},{"t":1744,"s":1,"x":"And once again, a necessary status check: none of these claims of positive natural density have passed peer review. They remain provisional artifacts under community scrutiny, deeply reliant on AI theorem provers."},{"t":1758,"s":0,"x":"So if global convergence in natural density is currently mired in unrefereed, purely asymptotic preprint claims, where is the solid mathematical ground in 2026?"},{"t":1769,"s":1,"x":"The sources shift our focus here to a mathematically distinct 2026 formalization."},{"t":1774,"s":0,"x":"Okay, what is it?"},{"t":1775,"s":1,"x":"This one looks away from global density entirely and looks directly at modular arithmetic."},{"t":1782,"s":0,"x":"We are talking about André Hallqvist's formalization titled *Effective Remainder Everywhere*, hosted on GitHub and Zenodo."},{"t":1789,"s":1,"x":"Yes."},{"t":1790,"s":0,"x":"It is vital to state up front that just like the others, this is an unrefereed, AI-assisted preprint accompanied by a Lean 4.35 formalization. It is not a peer-reviewed publication."},{"t":1802,"s":1,"x":"But the mathematical claim it makes is structurally fascinating because it completely sidesteps the chaos of forward dynamics."},{"t":1811,"s":0,"x":"But before we get into the mechanics of how it works, I need to set a hard, unbreakable boundary right now for you, the listener: this theorem is not a proof of the Collatz conjecture."},{"t":1821,"s":1,"x":"It absolutely is not. And the ultimate intuition pump to understand why modular reachability does not equal global convergence is to look at a parallel dynamical system."},{"t":1831,"s":0,"x":"A parallel system."},{"t":1832,"s":1,"x":"Yes. Hallqvist's exact same proof machinery applies to the generalized $5x + 1$ problem."},{"t":1840,"s":0,"x":"Let's pause and explain the $5x + 1$ system for a second. It's similar to Collatz, but if a number is odd, you multiply by $5$ and add $1$. If it's even, you divide by $2$."},{"t":1850,"s":1,"x":"Right. And in the $5x + 1$ system, the global conjecture—the idea that all numbers eventually reach $1$—is definitively, provably false."},{"t":1859,"s":0,"x":"Oh, it's false."},{"t":1861,"s":1,"x":"Yes, we know for a mathematical fact that there are at least three distinct, disjoint cycles: one has a minimal odd element of $1$, another has a minimal element of $13$, and another has $17$. Furthermore, empirical evidence heavily suggests there are orbits that simply diverge to infinity, never cycling and never returning."},{"t":1882,"s":0,"x":"So the $5x + 1$ system is a fractured landscape: multiple attractors, divergent paths. It is the exact antithesis of universal convergence."},{"t":1892,"s":1,"x":"Yet Hallqvist's modular reachability theorem holds equally true for the $5x + 1$ map."},{"t":1897,"s":0,"x":"Really?"},{"t":1897,"s":1,"x":"Yes. It yields an analogous bound—a ceiling taking the form of $2^{2^{105 N^5}}$—but the structural guarantee remains identical."},{"t":1909,"s":0,"x":"Because the theorem functions in a system known to contain multiple disjoint cycles and divergent trajectories, it is mathematically agnostic to whether the orbits globally converge to $1$."},{"t":1921,"s":1,"x":"It doesn't care where the orbits eventually end up in the forward direction; it only cares about the structure of the backward tree."},{"t":1927,"s":0,"x":"Oh, I see."},{"t":1928,"s":1,"x":"It proves that if you trace the predecessor tree backward from a valid target, that tree will eventually branch out and hit every single modular residue class."},{"t":1937,"s":0,"x":"The formal theorem states: for every modulus $N \\ge 1$, every natural number $w$ not divisible by $3$, and every residue class $r \\pmod N$, there exists an integer predecessor $n \\equiv r \\pmod N$ such that $n$ eventually reaches $w$."},{"t":1957,"s":1,"x":"There's a crucial arithmetic restriction in that statement that we need to highlight: the target root $w$ cannot be divisible by $3$."},{"t":1966,"s":0,"x":"Why?"},{"t":1967,"s":1,"x":"This comes down to an elementary structural constraint of the Collatz map itself. If you take any integer $m$ and apply an odd Collatz step, you calculate $3m + 1$."},{"t":1977,"s":0,"x":"Right."},{"t":1977,"s":1,"x":"That result, $3m + 1$, is congruent to $1 \\pmod 3$."},{"t":1983,"s":0,"x":"It leaves a remainder of $1$."},{"t":1984,"s":1,"x":"Exactly. Always. Therefore, an odd step can never produce a multiple of $3$. Multiples of $3$ simply have no odd predecessors. The only way to reach a multiple of $3$ is by dividing an even number by $2$."},{"t":1996,"s":0,"x":"So if you plant your target root $w$ at a multiple of $3$—say, the number $9$—and try to build the inverse tree backward, you can only ever multiply by $2$:"},{"t":2006,"s":1,"x":"Right."},{"t":2007,"s":0,"x":"$9 \\to 18 \\to 36 \\to 72$. You are permanently trapped in a single, unbranching lineage of doublings, all of which are multiples of $3$. You can never branch out to reach numbers that have remainders of $1$ or $2 \\pmod 3$."},{"t":2023,"s":1,"x":"Which is precisely why Hallqvist restricts the target $w$ to numbers not divisible by $3$."},{"t":2028,"s":0,"x":"But to be crystal clear on the directionality here: the target $w$ cannot be a multiple of $3$, but the predecessors absolutely can be."},{"t":2037,"s":1,"x":"That is a vital distinction. The restriction applies only to the root of the tree; the branches can go anywhere. For example, $117$ is a multiple of $3$, and it is a valid predecessor of $11$: $$117 \\to 352 \\to 176 \\to 88 \\to 44 \\to 22 \\to 11.$$"},{"t":2050,"s":0,"x":"Okay, I see."},{"t":2051,"s":1,"x":"Hallqvist proves we can find predecessors in every single residue class modulo $N$, including the zero modulo 3 class, as long as the root target $w$ isn't divisible by $3$."},{"t":2063,"s":0,"x":"So how does Hallqvist actually prove this universal modular reachability? The sources describe the architecture of the proof as a meet-in-the-middle approach."},{"t":2071,"s":1,"x":"It's a brilliant structural maneuver, conceptually similar to how computer scientists solve massive decision trees by connecting forward searches with backward databases."},{"t":2082,"s":0,"x":"Right."},{"t":2083,"s":1,"x":"Hallqvist avoids the chaotic, unpredictable trajectories of long forward orbits by factoring the modulus $N$. He breaks $N$ down into its prime components: $$N = 2^\\alpha \\cdot 3^b \\cdot M,$$"},{"t":2097,"s":0,"x":"where $M$ represents the coprime remainder, meaning $M$ shares no common factors with $2$ or $3$."},{"t":2105,"s":1,"x":"It's like navigating a grid city: the twos and threes are the avenues, and $M$ represents all the cross streets."},{"t":2112,"s":0,"x":"By breaking the modulus apart, you can conquer the congruences separately. Moving forward from the candidate residue class $r$, Hallqvist uses deterministic parity words—specific sequences of odd and even steps—to clear out the divisibility constraints imposed by the 2-adic and 3-adic components, $2^\\alpha$ and $3^b$."},{"t":2134,"s":1,"x":"You've forced the orbit through a specific sequence of operations that perfectly align the twos and threes. You navigate the avenues."},{"t":2141,"s":0,"x":"Meanwhile, moving backward from the target root $w$, the backward closure is analyzed not over the standard integers, but over the finite ring $\\mathbb{Z}/M\\mathbb{Z}$."},{"t":2152,"s":1,"x":"And within this finite ring, because $M$ is coprime to $2$ and $3$, multiplication by $2$ and the odd inverse operation are well-defined invertible affine transformations."},{"t":2163,"s":0,"x":"They are reliable geometric transformations within that finite modular space. You are navigating the cross streets."},{"t":2172,"s":1,"x":"And by utilizing modular lifting and the Chinese Remainder Theorem, Hallqvist proves that the forward path clearing the avenues and the backward path navigating the cross streets must necessarily intersect in the middle."},{"t":2185,"s":0,"x":"That's a mathematical pincer movement, and it guarantees reachability across all modular classes simultaneously."},{"t":2191,"s":1,"x":"Yes, it does."},{"t":2193,"s":0,"x":"But because it's a universal guarantee—because it promises to hit every single residue class, no matter the modulus—the resulting effective bound, the theoretical ceiling, is absolutely staggering."},{"t":2205,"s":1,"x":"The theorem guarantees that the predecessor $n$ will be bounded by: $$n \\le w \\cdot 2^{2^{48 N^4}}.$$"},{"t":2218,"s":0,"x":"We have to marvel at the sheer scale of this theoretical ceiling. Hallqvist provides a toy example in the repository to illustrate this. Let's walk through it."},{"t":2226,"s":1,"x":"Okay."},{"t":2227,"s":0,"x":"If you set the modulus $N = 7$ and your target $w = 11$, and you're looking for a predecessor in the zero modulo 7 residue class:"},{"t":2236,"s":1,"x":"the actual, real-world minimal witness for those parameters is simply the number $7$. The number $7$ is congruent to $0 \\pmod 7$, and in two steps, $7 \\to 22 \\to 11$, it reaches the target."},{"t":2251,"s":0,"x":"So the actual answer is $7$. It's right there."},{"t":2253,"s":1,"x":"Right."},{"t":2254,"s":0,"x":"But if you plug $N = 7$ and $w = 11$ into the ceiling formula, you evaluate: $$11 \\cdot 2^{2^{48 \\cdot 7^4}} = 11 \\cdot 2^{2^{115{,}248}}.$$"},{"t":2266,"s":1,"x":"which simplifies to $11 \\cdot 2^{2^{115{,}248}}$."},{"t":2274,"s":0,"x":"And when you convert that power tower into base 10, you get approximately: $$10^{10^{34{,}692.58}}.$$"},{"t":2283,"s":1,"x":"It is an astronomically large number."},{"t":2286,"s":0,"x":"Just to put that in perspective for the listener: a googol is a $1$ with $100$ zeros, $10^{100}$. A googolplex is $10^{\\text{googol}}$, or $10^{10^{100}}$."},{"t":2297,"s":1,"x":"Right."},{"t":2297,"s":0,"x":"A googolplex has a mere $100$ digits in its highest exponent. Hallqvist's bound has nearly $35{,}000$ digits in its highest exponent. It absolutely dwarfs a googolplex."},{"t":2309,"s":1,"x":"Which perfectly illustrates the critical distinction between effective bounds and practical computation. Hallqvist's bound is not an estimate of the smallest predecessor."},{"t":2319,"s":0,"x":"No, definitely not."},{"t":2320,"s":1,"x":"It is not a practical search range; no computer in the universe could search up to that number."},{"t":2328,"s":0,"x":"Its significance is entirely theoretical: it is a mathematical guarantee that infinite modular blind spots are impossible. It establishes a finite, explicit ceiling, proving that local congruence obstructions simply do not exist in the backward tree."},{"t":2344,"s":1,"x":"And this brings us to a defining feature of this entire late 2026 mathematical landscape:"},{"t":2349,"s":0,"x":"What's that?"},{"t":2350,"s":1,"x":"whether we are discussing Mazur's density claims on Proof Atlas, Kelvin Lau's Hexagon preprint, or Hallqvist's *Effective Remainder Everywhere*, there is a heavy, almost pervasive reliance on automated AI provers and interactive theorem provers like Lean 4.35."},{"t":2367,"s":0,"x":"This requires us to pause and really understand the epistemology of 2026, because this is fascinating: what does a machine-checked proof actually mean for human knowledge?"},{"t":2379,"s":1,"x":"On a technical level, it means strict toolchain dependency. Hallqvist's formalization, for example, strictly requires Lean 4.35 and relies exclusively on its core library; it will fail to compile on older versions like Lean 4.15."},{"t":2392,"s":0,"x":"Right."},{"t":2394,"s":1,"x":"But the philosophical shift is much deeper and much more significant. We have to distinguish between syntactic validity and semantic reality."},{"t":2403,"s":0,"x":"Let's break those terms down."},{"t":2404,"s":1,"x":"Syntactic validity is what the proof assistant provides. A system like Lean checks formal deduction. It guarantees internal logical consistency starting from core encoded axioms."},{"t":2415,"s":0,"x":"Okay."},{"t":2416,"s":1,"x":"In Lean, these are foundational rules like `propext`, `Classical.choice`, and `Quot.sound`."},{"t":2422,"s":0,"x":"Let me stop you there and translate those axioms for the listener, because they sound intimidating, but they are just the basic rules of the game."},{"t":2428,"s":1,"x":"Go ahead."},{"t":2429,"s":0,"x":"`propext`—propositional extensionality—basically tells the machine that if two statements mathematically prove each other, they can be treated as identical."},{"t":2437,"s":1,"x":"Yes."},{"t":2438,"s":0,"x":"`Classical.choice` is the rule that says if you have a non-empty collection of items, you can theoretically pick an item out of it, even if you don't have an explicit algorithm to find it. And `Quot.sound`—quotient soundness—just means if you group things together based on an equivalence relation, the machine respects that grouping when checking for equality."},{"t":2459,"s":1,"x":"Exactly. When Lean verifies a proof using those axioms, it certifies with absolute mechanical certainty that there are no hidden gaps in the deductive logic."},{"t":2469,"s":0,"x":"Right."},{"t":2470,"s":1,"x":"Step A logically leads to step B, all the way to the conclusion."},{"t":2475,"s":0,"x":"Which is incredible: we have a machine that can perfectly check the grammar and logic of a mathematical argument."},{"t":2479,"s":1,"x":"Yes,"},{"t":2480,"s":0,"x":"but this raises a huge philosophical question: if an AI writes the formal code, and another AI is used to explain or summarize that code, who verifies that the formal code actually represents the human mathematical intent?"},{"t":2494,"s":1,"x":"That is the crux of the epistemological issue. An AI system cannot peer-review itself. It cannot verify mathematical meaning; it only verifies formal structure."},{"t":2505,"s":0,"x":"So if an underlying definition encoded into Lean contains a semantic flaw—let's say it defines a concept of density that doesn't actually align with the true measure-theoretic definition of natural density we discussed earlier—the AI toolchain will happily generate a perfectly verified, logically flawless proof of a completely irrelevant statement."},{"t":2526,"s":1,"x":"It's like having a flawless grammar checker. The AI can tell you that a sentence is perfectly structured with impeccable syntax and punctuation, but the grammar checker has no idea if the sentence is actually expressing the intended truth."},{"t":2537,"s":0,"x":"Formal verification is not mathematical validation."},{"t":2541,"s":1,"x":"A Lean proof certifies the formal statement within the confines of the code, but the correspondence between that formalized code and the informal real-world mathematical theorem is an entirely separate matter."},{"t":2554,"s":0,"x":"This means human auditing hasn't been replaced by AI; it has just been structurally redirected."},{"t":2560,"s":1,"x":"Right. Human reviewers no longer need to check every single deductive inference step by step; Lean handles the heavy lifting of the deduction. But humans must now audit the semantic definitions."},{"t":2571,"s":0,"x":"We have to audit the interface between the formal code and the informal mathematical reality."},{"t":2577,"s":1,"x":"Without that human validation of meaning, a formally verified proof remains an unrefereed computational artifact."},{"t":2584,"s":0,"x":"So when we step back and look at this entire deep dive—from the sublinear trap to the Diophantine locks, difference inequalities, logarithmic density, and finally to modular reachability—what is the core takeaway for the listener auditing the $3x + 1$ problem as of late 2026?"},{"t":2603,"s":1,"x":"The problem is defined by a profound topological asymmetry built into the very fabric of deterministic arithmetic. When you look backward from a target, the predecessor tree is topologically pervasive and structurally organized. Hallqvist's formalization proves it is entirely devoid of local modular obstructions; the backward tree stretches out and reaches everywhere."},{"t":2630,"s":0,"x":"But the moment you turn around—the moment you look forward in time from a starting input—that exact same deterministic arithmetic disperses chaotically."},{"t":2639,"s":1,"x":"Exactly. We have logarithmic density descent from Tao's work heavily suppressing the outliers."},{"t":2645,"s":0,"x":"But actual positive natural density remains trapped behind the sublinear barrier, currently relegated to unrefereed preprints and asymptotic bounds with massive denominators. The forward trajectory remains analytically opaque."},{"t":2658,"s":1,"x":"It does."},{"t":2659,"s":0,"x":"And I want to leave you, the listener, with a final thought to explore on your own. We are taught to view the number line as this static, eternal sequence of integers just sitting there. But this dynamical system reveals it as a dynamic, directional terrain."},{"t":2674,"s":1,"x":"That's a great perspective."},{"t":2675,"s":0,"x":"If deterministic arithmetic is functionally, chaotically opaque when moving forward in time, but highly structured and guaranteed when moving backward, does time directionality exist within pure number theory? Are there other mathematical systems out there where the sheer arrow of computational time dictates our very ability to perceive structural truth?"},{"t":2695,"s":1,"x":"It's a fascinating question."},{"t":2697,"s":0,"x":"It makes you wonder if the integers themselves have a current flowing in a direction we are only just beginning to map. Think about that next time you look at a simple arithmetic equation."}];
let END = 2707; // 45:07 — replaced by the real DeepDive.mp3 duration once metadata loads

// ---------- Editorial notes with their dual-audio cue data ----------
// slot: DeepDive timestamp (s) at which the editor's voice is spliced in
// anchor: dialogue turn t after which the note card is placed in the document
// e0/e1: this note's segment range within Editor.mp3
const NOTES = [
  { slot: 165, anchor: 155, e0: 0,   e1: 28,  x: String.raw`Lower natural density is defined as $\underline{d}(A) = \liminf_{x \to \infty} \frac{\pi(x)}{x}$. Any sublinear growth bound $\pi(x) \ge x^\theta$ with $\theta < 1$ forces the implied density to exactly zero, since $\lim_{x \to \infty} \frac{x^\theta}{x} = \lim_{x \to \infty} \frac{1}{x^{1-\theta}} = 0$. "Almost everything" by raw count can still mean "density zero".` },
  { slot: 207, anchor: 207, e0: 28,  e1: 52,  x: String.raw`A correction to the spoken audio: it said the denominator becomes $x^{0.1}$, but since $1 - 0.9999 = 0.0001$, the correct residual exponent is $x^{0.0001}$. In either formulation the denominator diverges to infinity, crushing the ratio to zero — the conclusion is unchanged.` },
  { slot: 297, anchor: 297, e0: 52,  e1: 74,  x: String.raw`Formally, the accelerated Syracuse map acts only on odd positive integers: $T(n) = \frac{3n + 1}{2^{v_2(3n + 1)}}$, where $v_2$ extracts every factor of $2$ in one step. It compresses the usual Collatz iteration into single odd-to-odd jumps.` },
  { slot: 410, anchor: 410, e0: 74,  e1: 112, x: String.raw`The exact identity forced on a hypothetical cycle of $k$ odd steps and $K$ total divisions by $2$ is: $$n_0 (2^K - 3^k) = \sum_{j=0}^{k-1} 3^{k - 1 - j}, 2^{a_j},$$ where $a_j$ is the cumulative count of divisions by $2$ prior to step $j$. Since the summation consists entirely of positive integers, the coefficient $(2^K - 3^k)$ must be strictly positive.` },
  { slot: 431, anchor: 431, e0: 112, e1: 138, x: String.raw`Taking base-2 logarithms of $2^K > 3^k$ gives $\frac{K}{k} > \log_2 3 \approx 1.58496$. This "supercritical regime" is a strict structural requirement: every hypothetical non-trivial cycle must average strictly more than $\log_2 3$ divisions by $2$ per odd step.` },
  { slot: 486, anchor: 486, e0: 138, e1: 165, x: String.raw`The Diophantine prong treats the cycle identity as an exact discrete lock: fixing a specific parity sequence determines all coefficients, reducing the question to whether the sum is an exact integer multiple of $(2^K - 3^k)$. The obstacle is that the number of possible parity sequences grows exponentially with cycle length — a combinatorial explosion that makes exhaustive discrete testing impossible.` },
  { slot: 567, anchor: 567, e0: 165, e1: 186, x: String.raw`The residual gap is $\Lambda = K \ln 2 - k \ln 3$. Because $2^K > 3^k$ in the supercritical regime, $\Lambda$ is strictly positive; it measures how closely powers of $2$ and $3$ must approximate each other for a cycle to hide above the computationally verified range.` },
  { slot: 609, anchor: 609, e0: 186, e1: 218, x: String.raw`A clarification on the Archimedean bound. In classical cycle papers such as Simons and de Weger, it takes the form $n_{\min} < \frac{k}{e^\Lambda - 1} \approx \frac{k}{\Lambda}$. The text $\frac{k}{3^\Lambda}$ appears directly in the source survey, but both formulations work the same way: an effective lower bound on $\Lambda$ yields an upper bound on $n_{\min}$. Since brute-force searches have verified no non-trivial cycles below roughly $2^{68}$, a substantial $\Lambda$ rules a cycle out outright.` },
  { slot: 686, anchor: 686, e0: 218, e1: 251, x: String.raw`Baker's theory of linear forms in logarithms shows that $\Lambda$ cannot slide arbitrarily close to zero: explicit estimates by Laurent, Mignotte, and Nesterenko give $\ln \Lambda \ge -C (\ln K)^2$ for an explicit constant $C$. Substituting this floor into the Archimedean ceiling produces an effective upper bound on $n_{\min}$. Paired with lattice-basis reduction, this eliminated the 1-cycle (Steiner), cycles with up to $68$ local minima (Simons and de Weger), and up to $91$ local minima (Hercher).` },
  { slot: 808, anchor: 808, e0: 251, e1: 272, x: String.raw`The structural barrier: when the number of local minima $m$ grows linearly with the cycle length, the multidimensional Baker bounds deteriorate — the repulsion floor drops, the Archimedean ceiling rises, and the method no longer forces a contradiction against the verified $2^{68}$ range. Periodic orbits of arbitrary combinatorial complexity therefore remain theoretically open.` },
  { slot: 930, anchor: 930, e0: 272, e1: 309, x: String.raw`The archival benchmark is Krasikov and Lagarias (2003): $\pi(x) \ge x^{0.84}$ for all sufficiently large $x$. It was derived from difference inequalities balancing the explosive inverse even step ($n \mapsto 2n$) against the contracting inverse odd step ($n \mapsto \frac{n-1}{3}$). The program history: Crandall established polynomial growth, Krasikov reached exponent $0.43$, Wirsching $0.48$, then Applegate and Lagarias $0.65$ via computer-assisted tree search and $0.81$ via nonlinear programming.` },
  { slot: 1103, anchor: 1103, e0: 309, e1: 346, x: String.raw`What went wrong in Chao Liu's December 2025 preprint: the counting argument treated tree branches as independent when some relied on consecutive odd inverse operations. An inverse odd step $(n-1)/3$ can land on any parity, but when it lands on a multiple of $3$, that branch hits a dead end — multiples of $3$ have no odd predecessor — so consecutive odd inverses are blocked there. After community scrutiny, Liu retracted the claimed $0.946$ exponent; the revised version 2 gives $0.3227$, well below the 2003 baseline of $0.84$.` },
  { slot: 1241, anchor: 1241, e0: 346, e1: 377, x: String.raw`Forward descent foundations: Terras (1976) proved the set of integers with a finite stopping time — the orbit ever dips below its starting value — has natural density $1$. Korec (1994) strengthened this: for any $\theta > \frac{\log 3}{\log 4} \approx 0.7924$, almost every $n$ eventually drops below $n^\theta$. Note that localized descent, even below a fractional power, does not prevent an orbit from later diverging or entering an undiscovered cycle.` },
  { slot: 1354, anchor: 1354, e0: 377, e1: 417, x: String.raw`Tao's 2022 theorem is established in logarithmic density, $d_{\log}(S) = \lim_{x \to \infty} \frac{\sum_{n \le x,\ n \in S} 1/n}{\sum_{n \le x} 1/n}$, where each integer $n$ carries weight $1/n$ instead of a uniform weight. This dampener suppresses rare chaotic outliers and is what allows his first-passage machinery to stabilize. If a natural density exists, the logarithmic density equals it — but the converse fails: a set can have logarithmic density $1$ while its natural density oscillates indefinitely. The chasm between the two measures remains uncrossed.` },
  { slot: 1583, anchor: 1583, e0: 417, e1: 461, x: String.raw`The 2026 positive-density claims, all unrefereed: Mazur claimed an explicit constant $c$ with at least $cX$ integers below $X$ reaching $1$ within $10.46 \ln n$ steps, Lean-formalized; Shaik claimed polylogarithmic descent in natural density. Building on Mazur, Kelvin Lau derived: at least $\lfloor N / 2^{2^{2^{163}}} \rfloor$ odd integers below $N$ reach $1$. Because the denominator is a triply iterated power of $2$, the floor evaluates to exactly zero for every $N$ below $2^{2^{2^{163}}}$ — making the bound purely asymptotic and empirically empty for the observable number line.` },
  { slot: 1821, anchor: 1821, e0: 461, e1: 494, x: String.raw`Crucial caveat: Hallqvist's theorem is not a proof of the Collatz conjecture. The clearest demonstration is that the identical proof machinery applies to the generalized $5x + 1$ problem (with reachability ceiling $2^{2^{105 N^5}}$), where the global conjecture is provably false — at least three disjoint cycles are known (minimal odd elements $1$, $13$, $17$), alongside orbits that appear to diverge. A theorem that holds equally in a system containing multiple attractors is agnostic to whether orbits globally converge to $1$.` },
  { slot: 1967, anchor: 1967, e0: 494, e1: 534, x: String.raw`The divisibility-by-three condition is directional. An odd step produces $3m + 1 \equiv 1 \pmod 3$, never a multiple of $3$; consequently multiples of $3$ have no odd predecessors at all and can only be reached by doubling another multiple of $3$. The restriction applies strictly to the target root $w$ — predecessors may be multiples of $3$ (e.g. $117 \to 352 \to 176 \to 88 \to 44 \to 22 \to 11$). A backward tree rooted at, say, $9$ collapses to doublings $9 \to 18 \to 36 \to 72 \to \dots$ and can never reach residues $1$ or $2 \pmod 3$.` },
  { slot: 2083, anchor: 2083, e0: 534, e1: 573, x: String.raw`The meet-in-the-middle architecture: factor $N = 2^\alpha \cdot 3^b \cdot M$ with $\gcd(M, 6) = 1$. Forward from the candidate residue $r$, deterministic parity words clear the $2$-adic and $3$-adic divisibility constraints; backward from the target $w$, the closure is analyzed over the finite ring $\mathbb{Z}/M\mathbb{Z}$, where multiplication by $2$ and the inverse odd step $z \mapsto \frac{z-1}{3}$ are invertible affine transformations. Modular lifting and the Chinese Remainder Theorem guarantee the two paths intersect, yielding reachability across all residue classes simultaneously.` },
  { slot: 2205, anchor: 2205, e0: 573, e1: 619, x: String.raw`Ceiling versus witness: with $N = 7$, $w = 11$, the actual minimal witness is just $7$ ($7 \to 22 \to 11$), but the guaranteed ceiling is $11 \cdot 2^{2^{48 \cdot 7^4}} = 11 \cdot 2^{2^{115{,}248}} \approx 10^{10^{34{,}692.58}}$. For scale: a googolplex is $10^{10^{100}}$ with $100$ digits in its highest exponent, while this bound has roughly $34{,}693$ digits there. The bound is an effective search ceiling proving no infinite modular blind spots exist — not an estimate of the smallest witness.` },
  { slot: 2379, anchor: 2379, e0: 619, e1: 656, x: String.raw`The epistemology of formal verification: Lean certifies internal logical consistency — that a deduction follows strictly from stated axioms (<code>propext</code>, <code>Classical.choice</code>, <code>Quot.sound</code>) — with mechanical certainty. But it cannot establish that the formalized definitions faithfully represent the intended mathematical statement. An AI can write a formalization and another AI can explain it, but neither can certify its own interpretation. Human review is redirected, not replaced: humans audit the definitions and the informal-formal interface, since a perfectly verified proof of a mis-stated claim is still worthless.` }
];

const PAD = 350; // ms of breathing room between the two voices (200–500ms per spec)

// ---------- Build the unified document stream ----------
const mmss = s => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
function fmtHTML(raw) {
  let s = raw;
  s = s.replace(/\s*\*\(Editorial note:[\s\S]*?\)\*/g, "");
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
  return s;
}

const transcript = document.getElementById("transcript");
const frag = document.createDocumentFragment();
const blocks = []; // ordered rendering + sync model for the whole manuscript

// map: turn t -> notes anchored after it
const notesByAnchor = new Map();
NOTES.forEach((n, i) => {
  if (!notesByAnchor.has(n.anchor)) notesByAnchor.set(n.anchor, []);
  notesByAnchor.get(n.anchor).push(i);
});

TURNS.forEach((turn, ti) => {
  const p = document.createElement("p");
  p.className = "turn " + (turn.s === 0 ? "w" : "m");
  p.innerHTML = fmtHTML(turn.x);
  blocks.push({ kind: "turn", t: turn.t, idx: ti, el: p });
  frag.appendChild(p);
  frag.appendChild(document.createTextNode("\n"));
  (notesByAnchor.get(turn.t) || []).forEach(ni => {
    const n = NOTES[ni];
    const aside = document.createElement("aside");
    aside.className = "note";
    aside.innerHTML =
      '<div class="note-head"><span class="note-tag">Editor\u2019s note</span>' +
      '<span class="note-time">' + mmss(n.slot) + "</span></div>" +
      '<div class="note-body">' + n.x + "</div>";
    blocks.push({ kind: "note", t: n.slot, cue: ni, el: aside });
    frag.appendChild(aside);
    frag.appendChild(document.createTextNode("\n"));
  });
});
transcript.appendChild(frag);

const turnBlocks = blocks.filter(b => b.kind === "turn");
const noteBlocks = blocks.filter(b => b.kind === "note");
function elForNote(i) { return noteBlocks[i].el; }

// ---------- KaTeX (CDN; graceful fallback: raw $...$ stays readable) ----------
window.addEventListener("load", () => {
  if (typeof renderMathInElement !== "undefined") {
    renderMathInElement(transcript, {
      delimiters: [
        { left: "$$", right: "$$", display: true },
        { left: "\\[", right: "\\]", display: true },
        { left: "$", right: "$", display: false },
        { left: "\\(", right: "\\)", display: false }
      ],
      throwOnError: false
    });
  }
});

// ---------- Dual-audio orchestration engine ----------
const deep = document.getElementById("deep");
const editor = document.getElementById("editor");

let deepOK = true, editorOK = true;
let vDeep = 0, vEditor = 0;        // virtual clocks used only if an mp3 fails to load
let mode = "idle";                  // idle | deep | editor | paused-deep | paused-editor | waiting
let nextCue = 0;                   // index into NOTES of the next scheduled splice
let resumeAt = 0;                   // DeepDive position to return to after an editor note
let activeTurnIdx = -1;
let activeNoteIdx = -1;
let padTimer = null;
let lastFrame = null;
let rafId = null;
let follow = true;
let programmaticUntil = 0;
const isProgrammatic = () => performance.now() < programmaticUntil;

deep.addEventListener("error", () => { deepOK = false; });
editor.addEventListener("error", () => { editorOK = false; });
deep.addEventListener("loadedmetadata", () => {
  if (deepOK && isFinite(deep.duration) && deep.duration > 1) END = Math.ceil(deep.duration);
});
deep.addEventListener("ended", () => { if (mode === "deep") stopAll(); });
editor.addEventListener("ended", () => { if (mode === "editor") finishEditor(); });

const getDeepT = () => deepOK ? deep.currentTime : vDeep;
const getEditorT = () => editorOK ? editor.currentTime : vEditor;
function setDeepT(t) { if (deepOK) { try { deep.currentTime = t; } catch (e) {} } vDeep = t; }
function setEditorT(t) { if (editorOK) { try { editor.currentTime = t; } catch (e) {} } vEditor = t; }
function playDeep() { if (deepOK) { const p = deep.play(); if (p && p.catch) p.catch(() => {}); } }
function playEditor() { if (editorOK) { const p = editor.play(); if (p && p.catch) p.catch(() => {}); } }
function pauseAllAudio() { deep.pause(); editor.pause(); }
function firstCueAfter(t) {
  let i = 0;
  while (i < NOTES.length && NOTES[i].slot <= t) i++;
  return i;
}
function turnIndexAt(t) {
  let lo = 0, hi = TURNS.length - 1, res = 0;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (TURNS[mid].t <= t) { res = mid; lo = mid + 1; } else { hi = mid - 1; }
  }
  return res;
}

// ---------- Visual state ----------
function setActiveTurn(idx) {
  if (idx === activeTurnIdx) return;
  if (activeTurnIdx >= 0) turnBlocks[activeTurnIdx].el.classList.remove("active");
  activeTurnIdx = idx;
  if (idx >= 0) turnBlocks[idx].el.classList.add("active");
}
function setActiveNote(idx) {
  if (idx === activeNoteIdx) return;
  if (activeNoteIdx >= 0) elForNote(activeNoteIdx).classList.remove("active");
  activeNoteIdx = idx;
  if (idx >= 0) elForNote(idx).classList.add("active");
  document.body.classList.toggle("editor-phase", idx >= 0);
}
function refreshVisual() {
  const playing = mode === "deep" || mode === "editor";
  document.body.classList.toggle("playing", playing);
  if (mode === "deep" || mode === "paused-deep") {
    setActiveTurn(turnIndexAt(getDeepT()));
    setActiveNote(-1);
  } else if (mode === "editor" || mode === "paused-editor") {
    setActiveTurn(-1);
    // active note already set by the phase driver
  } else {
    setActiveTurn(-1);
    setActiveNote(-1);
  }
}

// ---------- Smooth auto-scroll with manual override ----------
function followStep() {
  if (!follow || (mode !== "deep" && mode !== "editor")) return;
  const el = (mode === "editor") ? elForNote(activeNoteIdx) : turnBlocks[activeTurnIdx];
  if (!el) return;
  const target = Math.max(0, el.offsetTop + 64 - window.innerHeight * 0.3);
  const delta = target - window.scrollY;
  if (Math.abs(delta) < 1) return;
  programmaticUntil = performance.now() + 150;
  window.scrollBy(0, delta * 0.12);
}
function reAnchor() {
  follow = true;
  const el = (mode === "editor" || mode === "paused-editor") ? elForNote(activeNoteIdx) : turnBlocks[activeTurnIdx];
  if (el) {
    programmaticUntil = performance.now() + 600;
    window.scrollTo({ top: Math.max(0, el.offsetTop + 64 - window.innerHeight * 0.3), behavior: "smooth" });
  }
}
function userScrolling() {
  if ((mode === "deep" || mode === "editor") && follow) follow = false;
}
window.addEventListener("wheel", userScrolling, { passive: true });
window.addEventListener("touchstart", userScrolling, { passive: true });
window.addEventListener("keydown", e => {
  if (["ArrowUp", "ArrowDown", "PageUp", "PageDown", "Home", "End"].includes(e.key)) userScrolling();
});
window.addEventListener("scroll", () => {
  if (!isProgrammatic()) userScrolling();
}, { passive: true });

// ---------- The playback frame loop ----------
function frame(ts) {
  rafId = null;
  const dt = lastFrame === null ? 0 : (ts - lastFrame) / 1000;
  lastFrame = ts;

  if (mode === "deep") {
    if (!deepOK) vDeep += dt;
    const t = getDeepT();
    setActiveTurn(turnIndexAt(t));
    setActiveNote(-1);
    if (nextCue < NOTES.length && t >= NOTES[nextCue].slot - 0.05) {
      const cue = NOTES[nextCue];
      resumeAt = cue.slot;
      deep.pause();
      mode = "waiting";
      refreshVisual();
      padTimer = setTimeout(() => beginEditor(nextCue), PAD);
    } else if (t >= END - 0.05) {
      stopAll();
    }
  } else if (mode === "editor") {
    if (!editorOK) vEditor += dt;
    const e = getEditorT();
    if (e >= NOTES[activeNoteIdx].e1 - 0.05) finishEditor();
  }

  followStep();
  if (mode === "deep" || mode === "editor") rafId = requestAnimationFrame(frame);
}
function ensureLoop() {
  if (rafId === null) { lastFrame = null; rafId = requestAnimationFrame(frame); }
}

function beginEditor(cueIdx) {
  padTimer = null;
  if (mode !== "waiting") return;
  const cue = NOTES[cueIdx];
  nextCue = cueIdx + 1;
  setEditorT(cue.e0);
  playEditor();
  mode = "editor";
  setActiveTurn(-1);
  setActiveNote(cueIdx);
  document.body.classList.add("playing", "editor-phase");
  ensureLoop();
}
function finishEditor() {
  editor.pause();
  mode = "waiting";
  document.body.classList.remove("playing");
  padTimer = setTimeout(() => {
    padTimer = null;
    if (mode !== "waiting") return;
    document.body.classList.remove("editor-phase");
    setDeepT(resumeAt);
    playDeep();
    mode = "deep";
    refreshVisual();
    document.body.classList.add("playing");
    ensureLoop();
  }, PAD);
}
function stopAll() {
  if (padTimer !== null) { clearTimeout(padTimer); padTimer = null; }
  pauseAllAudio();
  mode = "idle";
  refreshVisual();
  document.body.classList.remove("playing", "editor-phase");
}

// ---------- Click routing: the text is the entire interface ----------
blocks.forEach(b => {
  b.el.addEventListener("click", () => {
    if (mode === "waiting") return; // mid-handoff: ignore for the ~350ms splice window

    if (b.kind === "turn") {
      if ((mode === "deep" || mode === "paused-deep") && activeTurnIdx === b.idx) {
        // click on the currently playing turn -> pause / resume
        if (mode === "deep") { deep.pause(); mode = "paused-deep"; document.body.classList.remove("playing"); }
        else { playDeep(); mode = "deep"; document.body.classList.add("playing"); ensureLoop(); }
        return;
      }
      // seamless cut: start dialogue here, routing to DeepDive.mp3
      if (padTimer !== null) { clearTimeout(padTimer); padTimer = null; }
      pauseAllAudio();
      document.body.classList.remove("editor-phase");
      nextCue = firstCueAfter(b.t);
      setDeepT(b.t);
      playDeep();
      mode = "deep";
      refreshVisual();
      document.body.classList.add("playing");
      reAnchor();
      ensureLoop();
    } else {
      const cueIdx = b.cue;
      if ((mode === "editor" || mode === "paused-editor") && activeNoteIdx === cueIdx) {
        // click on the currently playing note -> pause / resume
        if (mode === "editor") { editor.pause(); mode = "paused-editor"; document.body.classList.remove("playing"); }
        else { playEditor(); mode = "editor"; document.body.classList.add("playing"); ensureLoop(); }
        return;
      }
      // seamless cut: play this note's segment from Editor.mp3
      if (padTimer !== null) { clearTimeout(padTimer); padTimer = null; }
      pauseAllAudio();
      const cue = NOTES[cueIdx];
      nextCue = cueIdx + 1;
      resumeAt = cue.slot;
      setEditorT(cue.e0);
      playEditor();
      mode = "editor";
      setActiveTurn(-1);
      setActiveNote(cueIdx);
      document.body.classList.add("playing", "editor-phase");
      reAnchor();
      ensureLoop();
    }
  });
});

// Space toggles pause/resume of whatever is currently speaking.
window.addEventListener("keydown", e => {
  if (e.code !== "Space" || e.target !== document.body) return;
  e.preventDefault();
  if (mode === "deep") { deep.pause(); mode = "paused-deep"; document.body.classList.remove("playing"); }
  else if (mode === "paused-deep") { playDeep(); mode = "deep"; document.body.classList.add("playing"); ensureLoop(); }
  else if (mode === "editor") { editor.pause(); mode = "paused-editor"; document.body.classList.remove("playing"); }
  else if (mode === "paused-editor") { playEditor(); mode = "editor"; document.body.classList.add("playing"); ensureLoop(); }
});
</script>
